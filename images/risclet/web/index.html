<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risclet</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Mono", monospace;
    }

    body {
      margin: 0;
      background: #111;
      color: #ddd;
    }

    main {
      display: grid;
      grid-template-columns: minmax(20rem, 1fr) minmax(20rem, 1fr);
      gap: 1rem;
      min-height: calc(100vh - 2rem);
      padding: 1rem;
    }

    section {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    h1 {
      margin: 0 0 0.75rem;
      font: inherit;
      font-weight: bold;
    }

    #editor,
    #terminal {
      box-sizing: border-box;
      flex: 1;
      min-height: 32rem;
      margin: 0;
      overflow: auto;
      padding: 1rem;
      border: 1px solid #444;
      border-radius: 0;
      outline: none;
      background: #111;
      color: #ddd;
      font: inherit;
      line-height: 1.35;
      tab-size: 8;
    }

    #editor {
      resize: none;
      white-space: pre;
    }

    #terminal {
      white-space: pre-wrap;
    }

    #editor:focus,
    #terminal:focus {
      border-color: #999;
    }

    #status {
      min-height: 1.35em;
      margin: 0 0 0.75rem;
    }

    @media (max-width: 50rem) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1><label for="editor">sort.s</label></h1>
      <textarea id="editor" aria-describedby="status" spellcheck="false"></textarea>
    </section>
    <section>
      <h1>Risclet console</h1>
      <p id="status" role="status">Loading source files…</p>
      <pre id="terminal" tabindex="0" aria-label="Virtual machine console"></pre>
    </section>
  </main>

  <script src="./riscbox.js"></script>
  <script type="module">
    import { Memory9PServer } from "./p9.js";

    const editorElement = document.querySelector("#editor");
    const statusElement = document.querySelector("#status");
    const terminalElement = document.querySelector("#terminal");
    const inputEncoder = new TextEncoder();
    const sourceNames = ["start.s", "sort.s", "print.s"];
    const specialKeys = new Map([
      ["Enter", "\r"],
      ["Backspace", "\x7f"],
      ["Tab", "\t"],
      ["Escape", "\x1b"],
      ["ArrowUp", "\x1b[A"],
      ["ArrowDown", "\x1b[B"],
      ["ArrowRight", "\x1b[C"],
      ["ArrowLeft", "\x1b[D"],
      ["Home", "\x1b[H"],
      ["End", "\x1b[F"],
      ["Delete", "\x1b[3~"],
    ]);
    let runtime = null;

    window.addEventListener("unhandledrejection", (event) => {
      statusElement.textContent = `Could not start the demo: ${event.reason}`;
    });

    const sourceEntries = await Promise.all(sourceNames.map(async (name) => {
      const response = await fetch(`demo/${name}`);
      if (!response.ok)
        throw new Error(`could not load ${name}: HTTP ${response.status}`);
      return [name, await response.text()];
    }));
    const server = new Memory9PServer(Object.fromEntries(sourceEntries));
    editorElement.value = new TextDecoder().decode(server.readFile("sort.s"));

    const term = {
      write(text) {
        terminalElement.append(document.createTextNode(text));
        terminalElement.scrollTop = terminalElement.scrollHeight;
      },
      getSize() {
        return [80, 25];
      },
    };
    server.subscribe((change) => {
      if (change.source !== "guest" || (change.path !== "sort.s" && change.oldPath !== "sort.s"))
        return;
      if (change.kind === "remove" || (change.kind === "rename" && change.path !== "sort.s")) {
        editorElement.value = "";
        statusElement.textContent = "Running · sort.s was removed by the guest";
        return;
      }
      editorElement.value = new TextDecoder().decode(server.readFile("sort.s"));
      statusElement.textContent = "Running · sort.s updated by the guest";
    });

    const keyText = (event) => {
      if (event.ctrlKey && !event.altKey && !event.metaKey && event.key.length === 1)
        return String.fromCharCode(event.key.toUpperCase().charCodeAt(0) & 31);

      return specialKeys.get(event.key) ??
        (!event.altKey && !event.metaKey && event.key.length === 1 ? event.key : null);
    };

    editorElement.addEventListener("input", () => {
      server.writeFile("sort.s", editorElement.value, "editor");
      statusElement.textContent = "Running · sort.s synchronized";
    });
    terminalElement.addEventListener("keydown", (event) => {
      const text = keyText(event);
      if (text === null || runtime === null)
        return;
      event.preventDefault();
      runtime.consoleInput(inputEncoder.encode(text));
    });

    try {
      const response = await fetch("./riscbox.wasm");
      if (!response.ok)
        throw new Error(`WASM request failed with status ${response.status}`);
      runtime = await Riscbox.instantiate(await response.arrayBuffer(), {
        p9Server: server,
        consoleWrite: (text) => term.write(text),
        onVmStarted: () => {
          statusElement.textContent = "Running · sort.s synchronized";
          terminalElement.focus();
        },
        onError: (error) => {
          statusElement.textContent = String(error);
          console.error(error);
        },
      });
      statusElement.textContent = "Loading VM assets…";
      const configUrl = new URL("riscbox.cfg", location.href).href;
      if (runtime.start(configUrl, 256) !== 0)
        throw new Error("Riscbox rejected the VM configuration");
    } catch (error) {
      statusElement.textContent = `Could not start the demo: ${error}`;
      console.error(error);
    }
  </script>
</body>
</html>
