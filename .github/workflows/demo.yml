name: Demo

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Manual and release-triggered deployments share the same Pages queue.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build Demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.archive.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      - name: Download published workspace version
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/demo-release.sh
      - name: Install demo build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc fakeroot cpio e2fsprogs
          command -v google-chrome
      - name: Build and test demo
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          DOCUMENTATION_REF: ${{ steps.archive.outputs.tag }}
        run: |
          make -C demo test RELEASE_ARCHIVE="$GITHUB_WORKSPACE/$ARCHIVE"
          tar -czf build/releases/riscbox-demo.tar.gz -C demo/dist .
      - name: Upload demo build artifact
        uses: actions/upload-artifact@v7
        with:
          name: riscbox-demo-${{ github.run_id }}
          path: build/releases/riscbox-demo.tar.gz
          if-no-files-found: error
      - name: Upload demo diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-diagnostics-${{ github.run_id }}
          path: demo/build/image-setup.log
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    name: Deploy Demo
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check deployment freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/demo-freshness.sh
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.freshness.outputs.current == 'true'
        id: deployment
