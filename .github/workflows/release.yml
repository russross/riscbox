name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Failed validation leaves the version untagged for the next main push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag
        id: version
        run: .github/scripts/release-plan.sh

  build:
    name: Test and Build Release
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld binaryen gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu bc bison flex libssl-dev libelf-dev dwarves
          command -v google-chrome
      - name: Install browser module compiler
        run: npm ci
      - name: Validate and package release
        run: make check-release
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: riscbox-${{ needs.prepare.outputs.version }}-${{ github.run_id }}
          path: build/releases/riscbox-${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error

  # Only publication receives repository write access, after all checks pass.
  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: riscbox-${{ needs.prepare.outputs.version }}-${{ github.run_id }}
          path: build/releases
      - name: Create release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          if tagged=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null); then
            test "$tagged" = "$GITHUB_SHA" || { echo "Tag $TAG points to another commit" >&2; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          archive="build/releases/riscbox-$VERSION.tar.gz"
          case "${VERSION%%+*}" in
            *-*) gh release create "$TAG" "$archive" --title "Riscbox $VERSION" --generate-notes --verify-tag --draft --prerelease ;;
            *) gh release create "$TAG" "$archive" --title "Riscbox $VERSION" --generate-notes --verify-tag --draft ;;
          esac
          gh release edit "$TAG" --draft=false

  # The reusable demo builds only after its runtime archive has been published.
  demo:
    name: Build and Deploy Demo
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo.yml
